config:
  target: "http://localhost:3002"

  phases:
    - duration: 60
      arrivalRate: 5
      name: CI load test

  plugins:
    ensure:
      thresholds:
        - http.response_time.p95: 500
        - http.response_time.p99: 1000
      conditions:
        - expression: "vusers.failed == 0"
    expect:
      reportFailuresAsErrors: true
      outputFormat: prettyError

scenarios:
  - name: Login
    flow:
      - post:
          url: "/auth"
          json:
            username: "{{ $env.BOOKER_USERNAME }}"
            password: "{{ $env.BOOKER_PASSWORD }}"
          expect:
            - hasProperty: token
            
  - name: Bookings
    flow:
      - get:
          url: "/booking"
          expect:
            - jmespath: "type(@) == 'array'"