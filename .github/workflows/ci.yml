name: CI

on:
  push:
  workflow_dispatch:

jobs:
  codeQuality:
    uses: ./.github/workflows/code-quality.yml

  api:
    uses: ./.github/workflows/api.yml
    secrets:
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}

  e2e:
    uses: ./.github/workflows/e2e.yml