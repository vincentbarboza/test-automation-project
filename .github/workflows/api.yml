name: API

on:
  workflow_call:
    secrets:
      BOOKER_USERNAME:
        required: true
      BOOKER_PASSWORD:
        required: true

jobs:
  restfulBooker:
    uses: ./.github/workflows/api-booker.yml
    secrets:
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}