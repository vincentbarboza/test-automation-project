name: Playwright

on:
  workflow_call:

jobs:
  e2e:
    name: Playwright - ${{ matrix.dataTarget }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        dataTarget:
          - en
          - de

    env:
      dataTarget: ${{ matrix.dataTarget }}
      VENDURE_SHOP_API_URL: 'http://localhost:3000/shop-api'
      NEXT_PUBLIC_VENDURE_SHOP_API_URL: 'http://localhost:3000/shop-api'
      SUPERADMIN_USERNAME: 'superadmin'
      SUPERADMIN_PASSWORD: 'superadmin'
      COOKIE_SECRET: 'test-cookie-secret'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendure-app/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install Vendure dependencies
        run: npm ci --prefix vendure-app

      - name: Get Playwright version
        id: playwrightVersion
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwrightCache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwrightVersion.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwrightCache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Start Vendure
        run: |
          npm run app:dev > vendure.log 2>&1 &
          echo $! > vendure.pid

      - name: Wait for Vendure
        run: |
          consecutive_successes=0

          for i in {1..60}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3001/${dataTarget}/")

            if [ "$status" = "200" ]; then
              consecutive_successes=$((consecutive_successes + 1))
              echo "Vendure returned 200 (${consecutive_successes}/3)"

              if [ "$consecutive_successes" -ge 3 ]; then
                echo "Vendure is ready for ${dataTarget}"
                exit 0
              fi
            else
              consecutive_successes=0
              echo "Vendure returned ${status}, waiting..."
            fi

            sleep 2
          done

          echo "Vendure failed to become stable for ${dataTarget}"
          cat vendure.log
          exit 1

      - name: Run Playwright tests
        run: npm run pw:test

      - name: Print Vendure logs on failure
        if: failure()
        run: cat vendure.log

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.dataTarget }}
          path: playwright-report/
          retention-days: 30