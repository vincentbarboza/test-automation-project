name: Vendure

on:
  workflow_call:

jobs:
  e2e:
    name: Vendure Playwright - ${{ matrix.dataTarget }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        dataTarget:
          - en
          - de

    env:
      suite: e2e
      dataTarget: ${{ matrix.dataTarget }}
      VENDURE_SHOP_API_URL: 'http://localhost:3000/shop-api'
      NEXT_PUBLIC_VENDURE_SHOP_API_URL: 'http://localhost:3000/shop-api'
      SUPERADMIN_USERNAME: 'superadmin'
      SUPERADMIN_PASSWORD: 'superadmin'
      COOKIE_SECRET: 'test-cookie-secret'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Vendure
        uses: ./.github/actions/setup-vendure
        with:
          data-target: ${{ matrix.dataTarget }}

      - name: Get Playwright version
        id: playwrightVersion
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwrightCache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwrightVersion.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwrightCache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run pw:test:vendure

      - name: Print Vendure logs on failure
        if: failure()
        run: cat vendure.log

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.dataTarget }}
          path: playwright-report/
          retention-days: 30