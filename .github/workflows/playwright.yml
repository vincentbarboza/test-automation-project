name: Playwright

on:
  workflow_call:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: npm ci

      - name: Install Vendure dependencies
        run: npm ci --prefix vendure-app

      - name: Start Vendure
        run: |
          npm run app:dev > vendure.log 2>&1 &
          echo $! > vendure.pid

      - name: Wait for Vendure
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:3001; then
              echo "Vendure is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Vendure failed to start"
          cat vendure.log
          exit 1

      - name: Run Playwright tests
        run: npm run pw:test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30