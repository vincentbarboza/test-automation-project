name: Playwright

on:
  workflow_call:

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendure-app/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install Vendure dependencies
        run: npm ci --prefix vendure-app

      - name: Get Playwright version
        id: playwrightVersion
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwrightCache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwrightVersion.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwrightCache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwrightCache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Vendure
        run: |
          npm run app:dev > vendure.log 2>&1 &
          echo $! > vendure.pid

      - name: Wait for Vendure
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:3001; then
              echo "Vendure is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Vendure failed to start"
          cat vendure.log
          exit 1

      - name: Run Playwright tests
        run: npm run pw:test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30