name: Performance

on:
  workflow_call:
    secrets:
      API_USERNAME:
        required: true
      API_PASSWORD:
        required: true

jobs:
  artillery:
    name: Restful Booker Artillery performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Restful Booker
        uses: ./.github/actions/setup-restful-booker

      - name: Run Artillery performance test
        run: npm run artillery:login:ci -- --output artillery-report.json

      - name: Print Restful Booker logs on failure
        if: failure()
        run: cat restful-booker.log

      - name: Upload Artillery report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: artillery-performance-report
          path: artillery-report.json
          if-no-files-found: ignore
          retention-days: 30
