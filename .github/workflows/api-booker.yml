name: Restful Booker

on:
  workflow_call:
    secrets:
      BOKKER_USERNAME:
        required: true
      BOKKER_PASSWORD:
        required: true

jobs:
  API:
    name: Restuful Booker Playwright API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      suite: api
      BOKKER_USERNAME: ${{ secrets.BOKKER_USERNAME }}
      BOKKER_PASSWORD: ${{ secrets.BOKKER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Restful Booker
        uses: ./.github/actions/setup-restful-booker

      - name: Run Playwright API tests
        run: npm run pw:test:booker
        
      - name: Print Restful Booker logs on failure
        if: failure()
        run: cat restful-booker.log

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-restful-booker
          path: playwright-report/
          retention-days: 30
