name: Set up Vendure
description: Install dependencies, seed sample data, start Vendure, and wait until it is ready

inputs:
  data-target:
    description: Storefront locale used for the readiness check
    required: false
    default: en

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          package-lock.json
          vendure-app/package-lock.json

    - name: Install test dependencies
      run: npm ci
      shell: bash

    - name: Install Vendure dependencies
      run: npm ci --prefix vendure-app
      shell: bash

    - name: Download Vendure sample data
      run: |
        npm pack @vendure/create@3.7.3 --pack-destination "$RUNNER_TEMP"
        mkdir -p "$RUNNER_TEMP/vendure-create"
        tar -xzf "$RUNNER_TEMP/vendure-create-3.7.3.tgz" -C "$RUNNER_TEMP/vendure-create" package/assets
      shell: bash

    - name: Populate Vendure sample data
      env:
        VENDURE_FACTORY_ASSETS_DIR: ${{ runner.temp }}/vendure-create/package/assets
      run: npm run seed:e2e --prefix vendure-app
      shell: bash

    - name: Start Vendure
      run: |
        npm run app:vendure > vendure.log 2>&1 &
        echo $! > vendure.pid
      shell: bash

    - name: Wait for Vendure
      env:
        DATA_TARGET: ${{ inputs.data-target }}
      run: |
        consecutive_successes=0

        for i in {1..60}; do
          status=$(curl -L -s -o /dev/null -w "%{http_code}" "http://localhost:3001/${DATA_TARGET}/" || true)

          if [ "$status" = "200" ]; then
            consecutive_successes=$((consecutive_successes + 1))
            echo "Vendure returned 200 (${consecutive_successes}/3)"

            if [ "$consecutive_successes" -ge 3 ]; then
              echo "Vendure is ready for ${DATA_TARGET}"
              exit 0
            fi
          else
            consecutive_successes=0
            echo "Vendure returned ${status:-no response}, waiting..."
          fi

          sleep 2
        done

        echo "Vendure failed to become stable for ${DATA_TARGET}"
        cat vendure.log
        exit 1
      shell: bash
